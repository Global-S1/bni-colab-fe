services:
  colab-fe-prod.bnitech.online:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colab-fe-prod.bnitech.online
    restart: unless-stopped
    ports:
      - "4322"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4322
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://colab-be-prod.bnitech.online:3002/api/v1}