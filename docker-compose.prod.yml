services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colab-fe.bnitech.online
    restart: always
    ports:
      - "4322"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4322
      - PUBLIC_API_URL=${PUBLIC_API_URL:-https://colab-be.bnitech.online/api/v1}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4322/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      coolify:
        aliases:
          - colab-fe.bnitech.online

networks:
  coolify:
    name: coolify
    driver: bridge
    external: true
